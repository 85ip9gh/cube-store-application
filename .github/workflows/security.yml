name: Security Gates

# No path filters, deliberately. A supply-chain gate that skips depending on
# which files a change touched is not a gate. Every pull request and every push
# to main runs all three scans.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  CHECKOV_IMAGE: "ghcr.io/bridgecrewio/checkov:3.3.13"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output gitleaks.tar.gz "$url"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      # Full history, not only the diff. The known Stripe test key predates this
      # workflow, so a diff-only scan would pass while the value is still
      # reachable in the published history of a public repository.
      # --redact keeps any hit out of the public run log.
      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          gitleaks git . --no-banner --redact --verbose --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 30

  deps:
    name: Dependency and container scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # ignore-unfixed is deliberately not set. A CVE with no upstream fix is
      # allowlisted by hand in .trivyignore with a dated reason, so the judgement
      # is recorded. Blanket-hiding unfixed findings would erase that record.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-fs.txt
          trivyignores: .trivyignore
          hide-progress: "true"

      # The image that runs on g7 is built from deploy/g7/Dockerfile, whose build
      # context is staged at deploy time and is not committed. Rebuild that
      # context here: the server tree plus an empty frontend directory. The
      # frontend is compiled static assets with no package manifest, so it adds
      # nothing that an image scan would read.
      - name: Stage the production image context
        if: always()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/image-context"
          mkdir -p "$stage/server" "$stage/frontend"
          cp web-store/server/package.json "$stage/server/"
          cp web-store/server/package-lock.json "$stage/server/"
          cp web-store/server/index.js "$stage/server/"
          cp -r web-store/server/controllers "$stage/server/"
          cp -r web-store/server/middleware "$stage/server/"
          cp -r web-store/server/Models "$stage/server/"
          cp -r web-store/server/routes "$stage/server/"
          cp deploy/g7/.dockerignore "$stage/.dockerignore"
          echo "IMAGE_CONTEXT=$stage" >> "$GITHUB_ENV"

      - name: Build the production image
        if: always()
        run: docker build --file deploy/g7/Dockerfile --tag cubestore:scan "$IMAGE_CONTEXT"

      - name: Trivy image scan
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: cubestore:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-image.txt
          trivyignores: .trivyignore
          hide-progress: "true"

      # Both scans write to a file so the reports survive as artifacts. Print
      # them as well, otherwise a failing gate says nothing in the run log.
      - name: Print scan reports
        if: always()
        run: |
          for report in trivy-fs.txt trivy-image.txt; do
            echo "===== $report ====="
            if [ -s "$report" ]; then
              cat "$report"
            else
              echo "no findings at HIGH or CRITICAL"
            fi
          done

      - name: Upload trivy reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-reports
          path: |
            trivy-fs.txt
            trivy-image.txt
          if-no-files-found: warn
          retention-days: 30

  iac:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Run the pinned checkov image directly rather than through the action, so
      # the exact flags are visible here. --skip-download keeps the run offline
      # and deterministic: nothing about this public repository is sent anywhere.
      #
      # Checkov has no docker_compose framework. Verified against 3.3.13, whose
      # valid frameworks are dockerfile, kubernetes, yaml, github_actions and
      # others, with no compose entry among them. So compose.yaml and
      # docker-compose.yml are not covered by this gate and their hardening is
      # reviewed by hand. github_actions is in scope instead: an unpinned action
      # or an injectable workflow expression is a supply-chain risk in the same
      # family as a vulnerable dependency, and this repository publishes from CI.
      - name: Checkov
        run: |
          set -euo pipefail
          # CKV_IGNORE_HIDDEN_DIRECTORIES=false is not cosmetic. Checkov skips
          # dot-directories by default, which was proved on the gate-proof
          # branch: a Dockerfile with no USER and no HEALTHCHECK passed cleanly
          # inside .gate-proof and failed immediately once moved to a visible
          # path. .devcontainer/Dockerfile is the common real case that would
          # otherwise never be scanned. .git is skipped explicitly, since
          # walking the object store finds nothing and costs time.
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            --env CKV_IGNORE_HIDDEN_DIRECTORIES=false "$CHECKOV_IMAGE" \
            --directory . \
            --framework dockerfile kubernetes github_actions \
            --skip-path node_modules \
            --skip-path '^\.git/' \
            --skip-download \
            --compact \
            --quiet \
            --output cli | tee checkov-report.txt

      - name: Upload checkov report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: checkov-report
          path: checkov-report.txt
          if-no-files-found: warn
          retention-days: 30
