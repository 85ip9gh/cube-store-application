name: Build and Test

on:
  pull_request:
    paths:
      - 'web-store/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'web-store/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-store

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web-store/package-lock.json
            web-store/server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Test server
        run: npm test --prefix server
