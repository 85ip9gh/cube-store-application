name: Build, Test, and Deploy

on:
  pull_request:
    paths:
      - 'web-store/**'
      - 'deploy/g7/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'web-store/**'
      - 'deploy/g7/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-store

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web-store/package-lock.json
            web-store/server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Test server
        run: npm test --prefix server

      - name: Upload production frontend
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: cube-store-frontend-${{ github.sha }}
          path: web-store/dist/web-store
          if-no-files-found: error
          retention-days: 2

  deploy-g7:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: cube-store-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://cubestore.pesanth.com

    steps:
      - name: Download production frontend
        uses: actions/download-artifact@v4
        with:
          name: cube-store-frontend-${{ github.sha }}
          path: frontend

      - name: Package release
        run: tar -C frontend -czf "$RUNNER_TEMP/cube-store-frontend.tgz" .

      - name: Trigger g7 deployment
        id: trigger
        env:
          DEPLOY_TOKEN: ${{ secrets.G7_DEPLOY_TOKEN }}
          DEPLOY_URL: https://cubestore.pesanth.com/__deploy
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/deploy-response.json"
          status_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --user-agent 'Mozilla/5.0 (compatible; CubeStoreGitHubDeploy/1.0)' \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "Content-Type: application/gzip" \
            --header "X-Commit-Sha: $GITHUB_SHA" \
            --data-binary "@$RUNNER_TEMP/cube-store-frontend.tgz" \
            "$DEPLOY_URL")"

          if [ "$status_code" != "202" ]; then
            echo "g7 rejected the deployment request with HTTP $status_code."
            cat "$response_file"
            exit 1
          fi

          deployment_id="$(jq -er '.deployment_id' "$response_file")"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for g7 health verification
        env:
          DEPLOY_TOKEN: ${{ secrets.G7_DEPLOY_TOKEN }}
          DEPLOY_URL: https://cubestore.pesanth.com/__deploy
          DEPLOYMENT_ID: ${{ steps.trigger.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(curl --silent --show-error --fail \
              --user-agent 'Mozilla/5.0 (compatible; CubeStoreGitHubDeploy/1.0)' \
              --header "Authorization: Bearer $DEPLOY_TOKEN" \
              "$DEPLOY_URL/$DEPLOYMENT_ID")"
            state="$(jq -r '.state' <<< "$response")"

            case "$state" in
              success)
                echo "Cube Store is healthy on g7."
                exit 0
                ;;
              failed)
                echo "$response" | jq .
                exit 1
                ;;
              queued|running)
                sleep 5
                ;;
              *)
                echo "Unexpected deployment state: $state"
                echo "$response" | jq .
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for the g7 deployment."
          exit 1
