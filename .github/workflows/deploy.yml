name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web-store/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./web-store
          file: ./web-store/Dockerfile
          push: true
          tags: 85ip9gh/cube-store-application:frontend-latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./web-store/server
          file: ./web-store/server/Dockerfile
          push: true
          tags: 85ip9gh/cube-store-application:backend-latest

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "web-store/docker-compose.yml,web-store/deploy.sh"
          target: "~/"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x ~/deploy.sh
            ~/deploy.sh
