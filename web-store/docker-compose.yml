services:
  frontend:
    image: 85ip9gh/cube-store-application:frontend-latest
    ports:
      - "4200:80"
    environment:
      - API_URL=${API_URL}

  backend:
    image: 85ip9gh/cube-store-application:backend-latest
    ports:
      - "4242:4242"
    env_file:
      - backend.env
    volumes:
      - cube_images:/app/cubes

volumes:
  cube_images: