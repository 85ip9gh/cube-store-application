<mat-card class="glass-panel !m-4 !rounded-2xl !p-3 sm:!m-6 sm:!p-4 lg:!mx-8">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <mat-form-field class="w-full sm:max-w-sm" subscriptSizing="dynamic">
            <mat-label>Search the collection</mat-label>
            <mat-icon matPrefix>search</mat-icon>
            <input matInput [(ngModel)]="searchTerm" (ngModelChange)="onSearchUpdated($event)">
        </mat-form-field>
        <div class="flex flex-wrap items-center justify-between gap-1 sm:justify-end">
            <button *ngIf="!mobile" mat-button [matMenuTriggerFor]="sortByMenu">
                Sort: {{ sort === 'desc' ? 'Newest' : 'Oldest' }}
                <mat-icon>expand_more</mat-icon>
            </button>
            <button *ngIf="mobile" mat-button [matMenuTriggerFor]="sortByMenu">
                {{sort}}
                <mat-icon>expand_more</mat-icon>
            </button>
            <mat-menu #sortByMenu="matMenu">
                <button mat-menu-item (click)="onSortUpdated('desc')" >
                    Newest first
                </button>
                <button mat-menu-item (click)="onSortUpdated('asc')">
                    Oldest first
                </button>
            </mat-menu>
            <div>
                <button *ngIf="!mobile" mat-button [matMenuTriggerFor]="menu">
                    Show {{ itemCount }}
                    <mat-icon>expand_more</mat-icon>
                </button>
                <button *ngIf="mobile" mat-button [matMenuTriggerFor]="menu">
                     {{ itemCount }}
                    <mat-icon>expand_more</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="onItemCountUpdated('All')">
                        All
                    </button>
                    <button mat-menu-item (click)="onItemCountUpdated('12')">
                        12 
                    </button>
                    <button mat-menu-item (click)="onItemCountUpdated('24')">
                        24
                    </button>
                    <button mat-menu-item (click)="onItemCountUpdated('36')">
                        36
                    </button>
                </mat-menu>
            </div>
            <div class="ml-1 flex items-center rounded-xl border border-line p-1" aria-label="Product view">
            <button class="grid h-10 w-10 place-items-center rounded-lg transition-colors hover:bg-ink/5 active:bg-ink/10" (click)="onColumnsUpdated(1)" aria-label="List view">
                <mat-icon>view_list</mat-icon>
            </button>
            <button class="grid h-10 w-10 place-items-center rounded-lg transition-colors hover:bg-ink/5 active:bg-ink/10" (click)="onColumnsUpdated(3)" aria-label="Three-column grid view">
                <mat-icon>view_module</mat-icon>
            </button>
            <button *ngIf="!mobile" class="grid h-10 w-10 place-items-center rounded-lg transition-colors hover:bg-ink/5 active:bg-ink/10" (click)="onColumnsUpdated(4)" aria-label="Four-column grid view">
                <mat-icon>view_comfy</mat-icon>
            </button>
            </div>
        </div>
    </div>
</mat-card>
