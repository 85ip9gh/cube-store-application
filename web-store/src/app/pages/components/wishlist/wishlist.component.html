<main class="site-shell py-12 sm:py-16 lg:py-20">
    <div class="flex flex-col gap-4 border-b border-line pb-8 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <p class="editorial-label">Your shortlist</p>
            <h1 class="mt-3 font-display text-5xl leading-none tracking-[-0.035em] text-ink sm:text-7xl">Saved objects</h1>
        </div>
        <p *ngIf="products.length" class="text-sm font-semibold text-ink-secondary">{{ products.length }} {{ products.length === 1 ? 'cube' : 'cubes' }} worth another look</p>
    </div>

    <div *ngIf="!products.length" class="surface-card mx-auto my-16 max-w-xl rounded-[2rem] px-7 py-16 text-center sm:px-12">
        <span class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-surface-muted text-brand"><mat-icon class="!text-3xl">favorite_border</mat-icon></span>
        <h2 class="mt-6 font-display text-4xl leading-none text-ink sm:text-5xl">Nothing saved yet.</h2>
        <p class="mx-auto mt-4 max-w-sm text-sm leading-6 text-ink-secondary">Tap the heart on any object and it will wait for you here.</p>
        <a routerLink="/home" class="primary-button mt-7">Explore the collection</a>
    </div>

    <div *ngIf="products.length" class="grid grid-cols-1 gap-x-5 gap-y-12 py-9 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <app-product-box *ngFor="let product of products" [product]="product" (addToCart)="onAddToCart($event)"></app-product-box>
    </div>
</main>
