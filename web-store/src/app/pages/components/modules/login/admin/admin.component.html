<div class="p-6 max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-4">
        <p class="text-2xl font-semibold text-ink">Manage Cubes</p>
        <div class="flex gap-2">
            <button mat-raised-button color="primary" (click)="onAddCube()">Add Cube</button>
            <button mat-stroked-button (click)="onLogout()">Logout</button>
        </div>
    </div>

    <table mat-table [dataSource]="products" class="w-full rounded-2xl overflow-hidden shadow-sm">

        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef>Image</th>
            <td mat-cell *matCellDef="let product">
                <img [src]="product.imagePath" [alt]="product.title" class="w-16 h-16 object-cover rounded-lg my-1">
            </td>
        </ng-container>

        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let product">{{ product.title }}</td>
        </ng-container>

        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef>Price</th>
            <td mat-cell *matCellDef="let product">{{ product.price | currency }}</td>
        </ng-container>

        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef>Category</th>
            <td mat-cell *matCellDef="let product">{{ product.category }}</td>
        </ng-container>

        <ng-container matColumnDef="size">
            <th mat-header-cell *matHeaderCellDef>Size</th>
            <td mat-cell *matCellDef="let product">{{ product.size }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let product">
                <button mat-button (click)="onEditCube(product)">Edit</button>
                <button mat-button color="warn" (click)="onDeleteCube(product)">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
