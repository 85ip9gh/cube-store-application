<aside class="surface-card sticky top-24 mx-0 mb-8 rounded-[1.5rem] p-4 sm:p-5" aria-label="Collection filters">
    <div class="flex items-center justify-between border-b border-line pb-4">
        <div>
            <p class="text-sm font-bold text-ink">Filter objects</p>
            <p class="mt-0.5 text-xs text-ink-secondary">Find your exact angle</p>
        </div>
        <button type="button" class="rounded-full px-3 py-2 text-xs font-bold text-brand transition hover:bg-brand/10" (click)="onReset()">Reset</button>
    </div>

    <section *ngIf="categories" class="border-b border-line py-5">
        <h3 class="text-[11px] font-bold uppercase tracking-[0.14em] text-ink-secondary">Material world</h3>
        <div class="mt-3 grid gap-1">
            <button type="button" class="filter-option" [ngClass]="{'filter-option-active': selectedCategory === ''}" (click)="onCategoryUpdate('')">
                <span>All materials</span>
                <mat-icon *ngIf="selectedCategory === ''" class="!text-lg">check</mat-icon>
            </button>
            <button type="button" class="filter-option" *ngFor="let category of categories" [ngClass]="{'filter-option-active': selectedCategory === category}" (click)="onCategoryUpdate(category)">
                <span>{{ category }}</span>
                <mat-icon *ngIf="selectedCategory === category" class="!text-lg">check</mat-icon>
            </button>
        </div>
    </section>

    <section *ngIf="sizes" class="border-b border-line py-5">
        <h3 class="text-[11px] font-bold uppercase tracking-[0.14em] text-ink-secondary">Scale</h3>
        <div class="mt-3 grid grid-cols-2 gap-2">
            <button type="button" class="filter-option !justify-center" [ngClass]="{'filter-option-active': selectedSize === 'All'}" (click)="onSizeUpdate('All')">All</button>
            <button type="button" class="filter-option !justify-center" *ngFor="let size of sizes" [ngClass]="{'filter-option-active': selectedSize === size}" (click)="onSizeUpdate(size)">{{ size }}</button>
        </div>
    </section>

    <section class="pt-5">
        <h3 class="text-[11px] font-bold uppercase tracking-[0.14em] text-ink-secondary">Price range</h3>
        <div class="mt-3 grid grid-cols-2 gap-2">
            <label class="block">
                <span class="mb-1.5 block text-[11px] font-semibold text-ink-secondary">Minimum</span>
                <span class="flex h-11 items-center rounded-xl border border-line bg-surface px-3 transition focus-within:border-brand focus-within:ring-4 focus-within:ring-brand/10">
                    <span class="text-sm text-ink-secondary">$</span>
                    <input name="minimumPrice" type="number" min="0" max="150" [formControl]="minimumPrice" (input)="onMinimumPriceUpdate()" class="min-w-0 flex-1 bg-transparent pl-1 text-sm font-semibold text-ink outline-none" placeholder="0">
                </span>
            </label>

            <label class="block">
                <span class="mb-1.5 block text-[11px] font-semibold text-ink-secondary">Maximum</span>
                <span class="flex h-11 items-center rounded-xl border border-line bg-surface px-3 transition focus-within:border-brand focus-within:ring-4 focus-within:ring-brand/10">
                    <span class="text-sm text-ink-secondary">$</span>
                    <input name="maximumPrice" type="number" min="0" max="150" [formControl]="maximumPrice" (input)="onMaximumPriceUpdate()" class="min-w-0 flex-1 bg-transparent pl-1 text-sm font-semibold text-ink outline-none" placeholder="150">
                </span>
            </label>
        </div>
        <p *ngIf="minimumPrice.invalid || maximumPrice.invalid" class="mt-2 text-xs font-semibold text-destructive">Enter a value between $0 and $150.</p>
    </section>
</aside>
