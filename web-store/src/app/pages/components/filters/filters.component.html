<div class="flex flex-col gap-3 p-3 w-full">
    <div class="flex justify-end">
        <button mat-button (click)="onReset()" class="!text-ink-secondary">
            <mat-icon class="text-base">restart_alt</mat-icon>
            Reset filters
        </button>
    </div>
    <mat-expansion-panel *ngIf="categories" class="!rounded-xl !shadow-none glass-panel">
        <mat-expansion-panel-header>
            <mat-panel-title class="text-center font-display text-lg text-ink">
                Category
            </mat-panel-title>
        </mat-expansion-panel-header>
        <mat-selection-list [multiple]="false" hideSingleSelectionIndicator>
            <mat-list-option class="text-center" color="accent" [selected]="selectedCategory === ''" (click)="onCategoryUpdate('')">
                All
            </mat-list-option>
            <mat-list-option class="text-center" color="accent" *ngFor="let category of categories" [value]="category"
                [selected]="selectedCategory === category" (click)="onCategoryUpdate(category)">
                {{category}}
            </mat-list-option>
        </mat-selection-list>
    </mat-expansion-panel>
    <mat-expansion-panel *ngIf="sizes" class="!rounded-xl !shadow-none glass-panel">
        <mat-expansion-panel-header>
            <mat-panel-title class="text-center font-display text-lg text-ink">
                Size
            </mat-panel-title>
        </mat-expansion-panel-header>
        <mat-selection-list [multiple]="false" hideSingleSelectionIndicator>
            <mat-list-option class="text-center" color="accent" [selected]="selectedSize === ''" (click)="onSizeUpdate('')">
                All
            </mat-list-option>
            <mat-list-option class="text-center" color="accent" *ngFor="let size of sizes" [value]="size"
                [selected]="selectedSize === size" (click)="onSizeUpdate(size)">
                {{size}}
            </mat-list-option>
        </mat-selection-list>
    </mat-expansion-panel>
    <mat-expansion-panel class="!rounded-xl !shadow-none glass-panel">
        <mat-expansion-panel-header>
            <mat-panel-title class="text-center font-display text-lg text-ink">
                Price
            </mat-panel-title>
        </mat-expansion-panel-header>
        <mat-selection-list>
            <div class="flex flex-col">
                <mat-form-field appearance="fill">
                    <mat-label class="text-center">Minimum price</mat-label>
                    <input matInput name="minimumPrice" type="number" [formControl]="minimumPrice"
                        (input)="onMinimumPriceUpdate()">
                    <mat-error>
                        {{getMinimumPriceErrorMessage()}}
                    </mat-error>
                    <span matTextPrefix>$&nbsp;</span>
                </mat-form-field>

                <mat-form-field appearance="fill">
                    <mat-label class="text-center">Maximum price</mat-label>
                    <input matInput name="maximumPrice" type="number" [formControl]="maximumPrice"
                        (input)="onMaximumPriceUpdate()">
                    <mat-error>
                        {{getMaximumPriceErrorMessage()}}
                    </mat-error>
                    <span matTextPrefix>$&nbsp;</span>
                </mat-form-field>
            </div>

        </mat-selection-list>
    </mat-expansion-panel>
</div>
